[project]
name = "knowledge-graph"
version = "0.1.0"
description = "Code intelligence knowledge graph (Memgraph + SCIP + tree-sitter)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "neo4j>=5.25",        # Bolt driver, talks to Memgraph
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "protobuf>=7.35.0",   # for scip.proto
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.4",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "memgraph_data", "memgraph_logs", ".run", ".logs", "scip-indexer/scip_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
  "B008",
  "SIM105",
  "SIM108",
  "SIM117",
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "knowledge-graph"
version = "0.0.1"
description = "Code intelligence knowledge graph for arenadata frontend projects"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "neo4j>=5.25",
  "httpx>=0.28",
  "watchdog>=5.0",
  "typer>=0.13",
  "questionary>=2.0",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false
